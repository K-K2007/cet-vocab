# 部署到 EdgeOne Makers（原 EdgeOne Pages）。
#
# 用 cnbcool/webhook 插件通知 EdgeOne 拉取并部署 —— CNB 没有原生 webhook，
# 官方要求用这个插件把 push 事件告诉 Makers。
#
# 注意：这条链路要生效，必须在 EdgeOne 控制台开启「自动部署」开关：
#   项目设置 → 环境管理 → 生产环境操作列「编辑」→ 自动部署 打开
# 该开关关闭时，webhook 请求会被接受并返回 200/ok，但不会新建任何部署
#（2026-09-27 排查确认的根因）。关闭状态下无论推多少次，站点都不会更新。
#
# 另外两种方式都不适用于本项目，别再走：
#   - edgeone makers deploy：只支持 Provider 为 'Upload' 的项目，本项目是从
#     CNB 导入的 Provider 'Cnb' 项目，CLI 会直接报错退出。
#   - 部署钩子：控制台里找不到入口（文档的「项目设置」模块列表里也没有它）。
#
# debug: true 会打印 webhook 的请求与响应，便于确认通知是否送达。
main:
  push:
    - stages:
        - name: notify
          image: cnbcool/webhook
          settings:
            urls:
              - https://api.edgeone.ai/eo/pages/hook/cnb
            method: POST
            content_type: application/json
            debug: true
            template: |
              {
                "repoName": "{{ CNB_REPO_NAME }}",
                "repoUrl": "{{ CNB_REPO_URL_HTTPS }}",
                "branch": "{{ CNB_BRANCH }}",
                "commit": "{{ CNB_COMMIT_SHORT }}",
                "commitMessage": "{{ CNB_COMMIT_MESSAGE }}",
                "committer": "{{ CNB_COMMITTER }}",
                "event": "{{ CNB_EVENT }}",
                "buildId": "{{ CNB_BUILD_ID }}",
                "buildWebUrl": "{{ CNB_BUILD_WEB_URL }}",
                "buildUser": "{{ CNB_BUILD_USER }}",
                "pipelineName": "{{ CNB_PIPELINE_NAME }}"
              }
