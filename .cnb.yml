# 部署到 EdgeOne Makers（原 EdgeOne Pages）——通过「部署钩子」触发。
#
# 为什么不用另外两种方式：
#
#  1. cnbcool/webhook 插件（官方示例模板那种）：它 POST 到
#     api.edgeone.ai/eo/pages/hook/cnb，会返回 200/code:0/ok，但从不真正触发
#     部署，失败也报成功。实测 2026-09-27 前后每次推送都是这样，站点一直没更新。
#
#  2. edgeone CLI（edgeone makers deploy）：只支持 Provider 为 'Upload' 的项目，
#     而 cet-vocab 是从 CNB 导入的 Provider 'Cnb' 项目，CLI 会直接报错退出。
#
# 部署钩子是每个项目独占的 URL，POST 一下就触发对应分支的部署，无需认证，
# 且与项目类型无关。URL 属于凭据，放在私有密钥仓库里，不写进本仓库
#（本仓库会同步到 GitHub 镜像）。
main:
  push:
    - imports: https://cnb.cool/athundergame/ci-secrets/-/blob/main/envs.yml
      stages:
        - name: Trigger EdgeOne deployment
          image: node:20
          script:
            - |
              if [ -z "$EDGEONE_DEPLOY_HOOK" ]; then
                echo "EDGEONE_DEPLOY_HOOK 未配置，无法触发部署。"
                echo "请到 EdgeOne 控制台 → 项目 cet-vocab → 项目设置 → 部署钩子，"
                echo "新建一个（分支选 main），再把得到的 URL 填进"
                echo "ci-secrets 仓库的 envs.yml 后推送。"
                exit 1
              fi
            - |
              node -e '
                const url = process.env.EDGEONE_DEPLOY_HOOK;
                fetch(url, { method: "POST" })
                  .then(async (r) => {
                    const body = await r.text();
                    console.log("HTTP", r.status);
                    console.log(body.slice(0, 800));
                    process.exit(r.ok ? 0 : 1);
                  })
                  .catch((e) => {
                    console.error("请求部署钩子失败:", e.message);
                    process.exit(1);
                  });
              '
